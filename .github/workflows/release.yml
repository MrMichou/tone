name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Run full CI suite before any release build
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  version-check:
    name: Verify Version Match
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version match
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch! Tag ($TAG_VERSION) != Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi

          echo "Versions match."

  build-linux:
    needs: [version-check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          TONE_VERSION: ${{ github.ref_name }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../tone-${{ matrix.target }}.tar.gz tone

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: tone-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tone-${{ matrix.target }}
          path: tone-${{ matrix.target }}.tar.gz

  build-macos:
    needs: [version-check]
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          TONE_VERSION: ${{ github.ref_name }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../tone-${{ matrix.target }}.tar.gz tone

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: tone-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tone-${{ matrix.target }}
          path: tone-${{ matrix.target }}.tar.gz

  build-windows:
    needs: [version-check]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          TONE_VERSION: ${{ github.ref_name }}

      - name: Package
        run: |
          cd target/x86_64-pc-windows-msvc/release
          7z a ../../../tone-x86_64-pc-windows-msvc.zip tone.exe

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: tone-x86_64-pc-windows-msvc.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tone-x86_64-pc-windows-msvc
          path: tone-x86_64-pc-windows-msvc.zip

  package-deb:
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x86_64-cargo-deb-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        run: cargo deb
        env:
          TONE_VERSION: ${{ github.ref_name }}

      - name: Rename .deb for consistency
        run: |
          DEB_FILE=$(find target/debian -name '*.deb' | head -1)
          cp "$DEB_FILE" tone-amd64.deb

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: tone-amd64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tone-deb
          path: tone-amd64.deb

  release:
    needs: [build-linux, build-macos, build-windows, package-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tone-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum tone-* > checksums.txt

      - name: Generate Scoop manifest
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA_WIN=$(grep "tone-x86_64-pc-windows-msvc.zip" checksums.txt | cut -d' ' -f1)
          sed -e "s/@@VERSION@@/$VERSION/g" \
              -e "s/@@SHA256_WINDOWS_X86_64@@/$SHA_WIN/g" \
              .github/packaging/scoop-manifest.json.template > tone.json

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: |
            ## Install

            **Homebrew (macOS/Linux):**
            ```
            brew install MrMichou/tap/tone
            ```

            **Shell installer:**
            ```
            curl -fsSL https://raw.githubusercontent.com/MrMichou/tone/master/install.sh | sh
            ```

            **Debian/Ubuntu (.deb):**
            ```
            # Download tone-amd64.deb from assets below, then:
            sudo dpkg -i tone-amd64.deb
            ```

            **Scoop (Windows):**
            ```
            scoop install https://github.com/MrMichou/tone/releases/download/${{ github.ref_name }}/tone.json
            ```

            ---

          generate_release_notes: true
          files: |
            tone-*
            checksums.txt
            tone.json

  publish-release:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false

